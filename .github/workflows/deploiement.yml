# Déploiement automatique sur le serveur de production.
#
# Se déclenche à chaque push sur la branche par défaut : GitHub se connecte en
# SSH au serveur, l'aligne sur le commit qui vient d'être poussé, puis lance
# `bin/deploy.sh`. L'onglet « Actions » du dépôt sert de journal de déploiement.
#
# ─── SECRETS À CRÉER (Settings ▸ Secrets and variables ▸ Actions) ─────────────
#
#   DEPLOY_HOST         adresse du serveur, ex. 185.180.206.46
#   DEPLOY_USER         compte SSH, ex. root
#   DEPLOY_SSH_KEY      clé PRIVÉE de déploiement (contenu entier du fichier)
#   DEPLOY_KNOWN_HOSTS  empreinte publique du serveur — voir plus bas
#   DEPLOY_PATH         chemin du clone, ex. /var/www/merisu-src
#
# Secret FACULTATIF :
#
#   ANTHROPIC_API_KEY   clé d'API pour la traduction assistée des libellés.
#                       Absente, la fonction reste éteinte et les écrans ne
#                       proposent pas le bouton — rien ne casse. Présente, elle
#                       est posée dans `.env.local` à chaque déploiement, et
#                       n'apparaît jamais dans le journal (GitHub la masque, et
#                       elle transite par l'entrée standard, pas par `ps`).
#
#   GOPOS_CLIENT_ID     identifiant de l'application GoPOS, et
#   GOPOS_CLIENT_SECRET son secret. Absents, la caisse reste non configurée et
#                       l'écran ne propose aucun import — rien ne casse. Les
#                       deux se saisissent aussi dans Admin ▸ Caisse.
#
#   OPENWEATHER_API_KEY clé One Call 3.0 pour la prévision de la semaine, posée
#                       de la même façon. Absente, le temps attendu se saisit à
#                       la main dans Seuils, comme avant. Elle peut aussi se
#                       saisir dans Admin ▸ Météo, où elle est chiffrée en base.
#
# Variables facultatives (Settings ▸ Secrets and variables ▸ Actions ▸ Variables) :
#
#   DEPLOY_PORT         port SSH si différent de 22
#   DEPLOY_PHP_BIN      binaire PHP, ex. php8.3 (défaut : php)
#   DEPLOY_HEALTH_URL   URL testée après déploiement, ex. http://127.0.0.1/merisu/connexion
#   MERISU_AI_MODEL     modèle de traduction (défaut : claude-opus-5)
#   GOPOS_ORGANIZATION_ID  numéro de la boutique, en chiffres nus (ex. 13232).
#                       Pas un secret : c'est un numéro, et c'est la valeur
#                       qu'on se trompe le plus souvent en saisissant — la
#                       voir en clair aide. Le préfixe « go_ » du panneau
#                       GoPOS ne s'y met PAS : c'est le numéro de client.
#   GOPOS_BASE_URL      adresse de l'API, si ce n'est pas app.gopos.io
#
#   OPENWEATHER_LAT     latitude de la boutique, ex. 52.2297
#   OPENWEATHER_LON     longitude de la boutique, ex. 21.0122
#   OPENWEATHER_PLACE   nom affiché à l'écran, ex. Varsovie. N'entre dans aucun
#                       appel : il sert à relire le lieu plutôt qu'un couple de
#                       nombres. Ce ne sont pas des secrets — d'où des
#                       variables, relisibles et corrigeables.
#
# DEPLOY_KNOWN_HOSTS mérite un mot : sans lui, le runner accepterait n'importe
# quel serveur se présentant à cette adresse, et lui livrerait la clé privée.
# Il se remplit avec la sortie de cette commande, lancée depuis une machine de
# confiance : ssh-keyscan -H 185.180.206.46

name: Déploiement

on:
  push:
    branches: [claude/merisu-inventory-production-3zy0zi]
    # Une correction de documentation n'a pas à redémarrer la production.
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      # Une LISTE FERMÉE, et non un champ libre. Ce texte finit dans une
      # commande shell sur le serveur : un champ libre serait une porte
      # d'exécution ouverte à quiconque peut déclencher le workflow.
      maintenance:
        description: "Commande de maintenance à lancer après le déploiement"
        required: false
        default: 'aucune'
        type: choice
        options:
          - aucune
          - 'ventes-tout'
          - 'meteo-historique'
          - 'ventes-et-meteo'
      depuis:
        description: "Date de début du rattrapage météo (AAAA-MM-JJ)"
        required: false
        default: '2026-04-20'
        type: string

# Deux déploiements simultanés se marcheraient dessus pendant le cache:clear.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    name: Mettre à jour le serveur
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Préparer la connexion SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY:-}" ] || [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::error::Secrets manquants. Créer DEPLOY_SSH_KEY et DEPLOY_KNOWN_HOSTS (voir l'entête du workflow)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf, pas echo : préserve les sauts de ligne de la clé PEM.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploiement
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploiement ~/.ssh/known_hosts

          # Erreur de copier-coller la plus fréquente : le corps de la clé est
          # là, mais les lignes BEGIN/END sont restées derrière. Le contenu est
          # intact — seule l'enveloppe manque. On la remet, et la validation
          # ci-dessous tranche : si la réparation ne suffit pas, elle échoue.
          if ! ssh-keygen -y -f ~/.ssh/id_deploiement > /dev/null 2>&1 \
             && head -1 ~/.ssh/id_deploiement | grep -q '^b3BlbnNzaC1rZXktdjE'; then
            echo "::warning::Lignes BEGIN/END absentes de DEPLOY_SSH_KEY — enveloppe reconstituée."
            {
              echo "-----BEGIN OPENSSH PRIVATE KEY-----"
              grep -v '^-----' ~/.ssh/id_deploiement
              echo "-----END OPENSSH PRIVATE KEY-----"
            } > ~/.ssh/id_deploiement.reparee
            mv ~/.ssh/id_deploiement.reparee ~/.ssh/id_deploiement
            chmod 600 ~/.ssh/id_deploiement
          fi

          # Sans ce contrôle, une clé mal collée ne se manifeste que par un
          # « error in libcrypto » suivi d'un « Permission denied » — deux
          # messages qui ne disent pas où est le problème. Autant le nommer.
          if ! ssh-keygen -y -f ~/.ssh/id_deploiement > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY n'est pas une clé privée exploitable."
            echo "Vérifications, dans l'ordre :"
            echo "  1. c'est bien la clé PRIVÉE (~/.ssh/merisu_deploy), pas le .pub ;"
            echo "  2. les lignes BEGIN et END sont présentes ;"
            echo "  3. les sauts de ligne ont survécu au copier-coller."
            echo "Première ligne reçue : $(head -1 ~/.ssh/id_deploiement | cut -c1-40)"
            echo "Nombre de lignes reçues : $(wc -l < ~/.ssh/id_deploiement)"
            exit 1
          fi

          if ! grep -q 'ssh-' ~/.ssh/known_hosts; then
            echo "::error::DEPLOY_KNOWN_HOSTS ne contient aucune clé d'hôte exploitable."
            exit 1
          fi

          echo "Clé de déploiement : $(ssh-keygen -l -f ~/.ssh/id_deploiement | cut -d' ' -f1,2)"
          echo "Hôtes connus : $(grep -c 'ssh-\|ecdsa-' ~/.ssh/known_hosts) entrée(s)"

      - name: Déployer le commit ${{ github.sha }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          PHP_BIN: ${{ vars.DEPLOY_PHP_BIN || 'php' }}
          BRANCHE: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Un chemin collé depuis un terminal traîne souvent un retour chariot
          # ou une espace. Invisibles à l'écran, ils font échouer le `cd` avec
          # un « No such file or directory » qui accuse le mauvais coupable.
          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          # On vise le commit exact qui a déclenché ce run, et non « la pointe
          # de la branche » : si un second push survient pendant l'exécution,
          # le serveur reste cohérent avec ce que ce journal affiche.
          #
          # `reset --hard` ne touche ni aux fichiers ignorés ni aux non suivis :
          # .env.local, var/ (base de données) et public/uploads/ survivent.
          ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" bash -euo pipefail -s -- \
              "$APP_PATH" "$BRANCHE" "$COMMIT" "$PHP_BIN" <<'DISTANT'
          APP_PATH="$1"; BRANCHE="$2"; COMMIT="$3"; PHP_BIN="$4"

          # DEPLOY_PATH est masqué dans le journal : sans ce diagnostic, une
          # valeur erronée ne produit qu'un « cd: ***: No such file » muet.
          # On dit donc ce que le serveur voit, lui n'est pas masqué.
          if [ ! -d "$APP_PATH" ]; then
            echo "✗ DEPLOY_PATH ne désigne aucun dossier sur ce serveur." >&2
            echo "  Dépôts trouvés :" >&2
            find /var/www /opt /srv /root /home -maxdepth 4 -type d -name symfony \
                 -exec test -d '{}'/bin ';' -print 2>/dev/null | sed 's|/symfony$|  ← à mettre dans DEPLOY_PATH|' >&2
            exit 1
          fi

          cd "$APP_PATH"

          if [ ! -d .git ]; then
            echo "✗ $APP_PATH existe mais n'est pas un dépôt Git." >&2
            echo "  Le workflow met à jour un clone ; il n'en crée pas." >&2
            exit 1
          fi

          echo "▸ Récupération depuis GitHub"
          git fetch --prune origin "$BRANCHE"

          echo "▸ Alignement sur $COMMIT"
          git checkout -B "$BRANCHE" "$COMMIT"

          echo "▸ Déploiement"
          cd symfony
          PHP_BIN="$PHP_BIN" bash bin/deploy.sh
          DISTANT

      # Après le déploiement, et non avant : `bin/deploy.sh` crée `.env.local`
      # au premier passage, avec le secret d'application. Y écrire d'abord
      # aurait fabriqué un fichier que le script aurait ensuite trouvé
      # « déjà là », et l'application aurait démarré sans APP_SECRET.
      #
      # Rien à reconstruire derrière : `.env.local` est relu à chaque requête,
      # et les `%env(...)%` d'un conteneur compilé se résolvent à l'exécution.
      #
      # L'étape s'exécute TOUJOURS et se retire elle-même quand le secret est
      # absent. Pas de `if:` ici : le contexte `secrets` n'est pas lisible dans
      # une condition d'étape, et GitHub refuse alors le fichier ENTIER — le
      # déploiement ne démarre même pas, sans qu'aucun job n'apparaisse.
      - name: Poser la clé de traduction assistée
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          CLE: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELE: ${{ vars.MERISU_AI_MODEL }}
        run: |
          set -euo pipefail

          if [ -z "${CLE:-}" ]; then
            echo "→ Aucun secret ANTHROPIC_API_KEY : traduction assistée non configurée."
            echo "  Rien de cassé — les écrans ne proposeront pas le bouton « Traduire »."
            exit 0
          fi

          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          # La clé passe par l'ENTRÉE STANDARD, pas par la ligne de commande :
          # les arguments d'un processus se lisent dans `ps` par n'importe quel
          # compte du serveur, et une clé d'API n'a pas à s'y montrer, fût-ce
          # une seconde. Le script, lui, n'a rien de secret et peut voyager en
          # argument.
          DISTANT='
            set -euo pipefail
            cd "$1/symfony"

            IFS= read -r CLE || true
            [ -n "$CLE" ] || { echo "✗ clé vide" >&2; exit 1; }

            MODELE="$2"

            if [ ! -f .env.local ]; then
              echo "✗ .env.local absent : le déploiement a-t-il abouti ?" >&2
              exit 1
            fi

            TMP="$(mktemp)"
            grep -v -e "^ANTHROPIC_API_KEY=" -e "^MERISU_AI_MODEL=" .env.local > "$TMP" || true
            printf "ANTHROPIC_API_KEY=%s\n" "$CLE" >> "$TMP"
            [ -z "$MODELE" ] || printf "MERISU_AI_MODEL=%s\n" "$MODELE" >> "$TMP"

            # `cat >` et non `mv` : le fichier garde son inode, son
            # propriétaire et ses droits. Un `mv` l’aurait rendu à root, et
            # le serveur web ne l’aurait plus lu.
            cat "$TMP" > .env.local
            rm -f "$TMP"

            echo "✓ Traduction assistée configurée${MODELE:+ (modèle $MODELE)}"
          '

          # ssh RECOLLE ses arguments en UNE chaîne, que le shell distant
          # reparse. Un script multiligne passé tel quel s'y désagrège : `-c`
          # perd son argument, et les lignes suivantes s'exécutent comme autant
          # de commandes — « bash: -c: option requires an argument ». Il part
          # donc en un SEUL mot, protégé par des apostrophes.
          #
          # Le déploiement, lui, envoie son script par l'entrée standard ; ici
          # l'entrée standard porte déjà le secret, d'où ce détour.
          citer() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\''/g")"; }

          printf '%s\n' "$CLE" | ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" \
              "bash -euo pipefail -c $(citer "$DISTANT") -- $(citer "$APP_PATH") $(citer "$MODELE")"

      # Même dispositif pour la clé météo, et pour les mêmes raisons : pas de
      # `if:` au niveau de l'étape, la clé par l'entrée standard.
      #
      # Les coordonnées, elles, ne sont pas des secrets — ce sont celles d'une
      # boutique dont l'adresse est publique. Elles passent donc par des
      # VARIABLES de dépôt, où on peut les relire et les corriger sans avoir à
      # redevenir administrateur des secrets.
      #
      # La clé peut aussi se saisir dans Admin ▸ Météo, où elle est chiffrée en
      # base ; cette étape existe pour les installations qui préfèrent que rien
      # de sensible ne vive dans la base applicative.
      # Les identifiants de caisse, posés comme les autres secrets : pas de
      # `if:` au niveau de l'étape, la valeur par l'entrée standard.
      #
      # L'Organization ID n'est pas un secret — c'est un numéro de boutique.
      # Il passe donc par une VARIABLE de dépôt, relisible et corrigeable sans
      # redevenir administrateur des secrets. C'est aussi la valeur qu'on se
      # trompe le plus souvent en saisissant : la voir en clair aide.
      #
      # Les trois se saisissent aussi dans Admin ▸ Caisse, où le secret est
      # chiffré en base ; cette étape sert aux installations qui préfèrent que
      # rien de sensible ne vive dans la base applicative.
      - name: Poser les identifiants de caisse
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          CLIENT: ${{ secrets.GOPOS_CLIENT_ID }}
          SECRET: ${{ secrets.GOPOS_CLIENT_SECRET }}
          ORG: ${{ vars.GOPOS_ORGANIZATION_ID }}
          BASE: ${{ vars.GOPOS_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CLIENT:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "→ Aucun secret GOPOS_CLIENT_ID / GOPOS_CLIENT_SECRET : caisse non configurée."
            echo "  Rien de cassé — les identifiants peuvent aussi se saisir dans Admin ▸ Caisse."
            exit 0
          fi

          if [ -z "${ORG:-}" ]; then
            # Une paire sans numéro d'organisation n'obtient aucun jeton, et la
            # caisse ne sait pas lister les boutiques d'abord. Le dire ici évite
            # de chercher côté serveur pourquoi l'écran reste muet.
            echo "→ Identifiants posés sans GOPOS_ORGANIZATION_ID (variable de dépôt)."
            echo "  La caisse refusera le jeton tant qu'il manquera."
          fi

          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          DISTANT='
            set -euo pipefail
            cd "$1/symfony"

            IFS= read -r SECRET || true
            [ -n "$SECRET" ] || { echo "✗ secret vide" >&2; exit 1; }

            CLIENT="$2"; ORG="$3"; BASE="$4"

            if [ ! -f .env.local ]; then
              echo "✗ .env.local absent : le déploiement a-t-il abouti ?" >&2
              exit 1
            fi

            TMP="$(mktemp)"
            grep -v -e "^GOPOS_CLIENT_ID=" -e "^GOPOS_CLIENT_SECRET=" \
                    -e "^GOPOS_ORGANIZATION_ID=" -e "^GOPOS_BASE_URL=" .env.local > "$TMP" || true
            printf "GOPOS_CLIENT_ID=%s\n" "$CLIENT" >> "$TMP"
            printf "GOPOS_CLIENT_SECRET=%s\n" "$SECRET" >> "$TMP"
            [ -z "$ORG" ]  || printf "GOPOS_ORGANIZATION_ID=%s\n" "$ORG" >> "$TMP"
            [ -z "$BASE" ] || printf "GOPOS_BASE_URL=%s\n" "$BASE" >> "$TMP"

            # `cat >` et non `mv` : le fichier garde son inode, son
            # propriétaire et ses droits.
            cat "$TMP" > .env.local
            rm -f "$TMP"

            echo "✓ Caisse configurée${ORG:+ (organisation $ORG)}"
          '

          # Le script part en un seul mot protégé : voir « Poser la clé de
          # traduction assistée » pour le pourquoi.
          citer() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\''/g")"; }

          printf '%s\n' "$SECRET" | ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" \
              "bash -euo pipefail -c $(citer "$DISTANT") -- $(citer "$APP_PATH") $(citer "$CLIENT") $(citer "$ORG") $(citer "$BASE")"

      - name: Poser la clé météo
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          CLE: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ vars.OPENWEATHER_LAT }}
          LON: ${{ vars.OPENWEATHER_LON }}
          LIEU: ${{ vars.OPENWEATHER_PLACE }}
        run: |
          set -euo pipefail

          if [ -z "${CLE:-}" ]; then
            echo "→ Aucun secret OPENWEATHER_API_KEY : météo non configurée."
            echo "  Rien de cassé — le temps attendu se saisit à la main dans Seuils,"
            echo "  et la clé peut aussi se poser dans Admin ▸ Météo."
            exit 0
          fi

          if [ -z "${LAT:-}" ] || [ -z "${LON:-}" ]; then
            # Une clé sans coordonnées ne rend rien. Le dire ici évite de
            # chercher côté serveur pourquoi l'écran reste muet.
            echo "→ Clé météo posée sans OPENWEATHER_LAT / OPENWEATHER_LON."
            echo "  Renseignez-les en variables de dépôt, ou dans Admin ▸ Météo."
          fi

          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          DISTANT='
            set -euo pipefail
            cd "$1/symfony"

            IFS= read -r CLE || true
            [ -n "$CLE" ] || { echo "✗ clé vide" >&2; exit 1; }

            LAT="$2"; LON="$3"; LIEU="$4"

            if [ ! -f .env.local ]; then
              echo "✗ .env.local absent : le déploiement a-t-il abouti ?" >&2
              exit 1
            fi

            TMP="$(mktemp)"
            grep -v -e "^OPENWEATHER_API_KEY=" -e "^OPENWEATHER_LAT=" \
                    -e "^OPENWEATHER_LON=" -e "^OPENWEATHER_PLACE=" .env.local > "$TMP" || true
            printf "OPENWEATHER_API_KEY=%s\n" "$CLE" >> "$TMP"
            [ -z "$LAT" ]  || printf "OPENWEATHER_LAT=%s\n" "$LAT" >> "$TMP"
            [ -z "$LON" ]  || printf "OPENWEATHER_LON=%s\n" "$LON" >> "$TMP"
            [ -z "$LIEU" ] || printf "OPENWEATHER_PLACE=\"%s\"\n" "$LIEU" >> "$TMP"

            # `cat >` et non `mv` : le fichier garde son inode, son
            # propriétaire et ses droits.
            cat "$TMP" > .env.local
            rm -f "$TMP"

            echo "✓ Météo configurée${LIEU:+ ($LIEU)}"
          '

          # Le script part en un seul mot protégé : voir « Poser la clé de
          # traduction assistée » pour le pourquoi.
          citer() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\''/g")"; }

          printf '%s\n' "$CLE" | ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" \
              "bash -euo pipefail -c $(citer "$DISTANT") -- $(citer "$APP_PATH") $(citer "$LAT") $(citer "$LON") $(citer "$LIEU")"

      # ── Les tâches planifiées, posées à chaque déploiement ────────────────
      #
      # Sans elles, la prévision ne se renouvelle pas et le journal météo ne se
      # remplit jamais : la corrélation ventes × temps resterait à jamais sans
      # matière. Idempotent — les lignes sont retirées puis réécrites, jamais
      # empilées.
      - name: Poser les tâches planifiées
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          PHP_BIN: ${{ vars.DEPLOY_PHP_BIN || 'php' }}
        run: |
          set -euo pipefail

          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          # Le script part par l'ENTRÉE STANDARD (`-s`), comme au déploiement :
          # rien de secret à y faire passer ici, et un script multiligne ne
          # survit pas au voyage en argument.
          SORTIE=0
          ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" bash -euo pipefail -s -- "$APP_PATH" "$PHP_BIN" <<'DISTANT' || SORTIE=$?
          CIBLE="$1/symfony"
          PHP="$2"

          # Le marqueur permet de retirer NOS lignes sans toucher aux
          # autres : un crontab appartient à la machine, pas à ce dépôt.
          MARQUE="# merisu"
          ACTUEL="$(crontab -l 2>/dev/null | grep -v "$MARQUE" || true)"

          {
            printf "%s\n" "$ACTUEL"
            printf "0 5 * * * cd %s && %s bin/console merisu:meteo >/dev/null 2>&1 %s\n" "$CIBLE" "$PHP" "$MARQUE"
            printf "30 2 * * * cd %s && %s bin/console merisu:ventes >/dev/null 2>&1 %s\n" "$CIBLE" "$PHP" "$MARQUE"
          } | crontab -

          echo "✓ Tâches planifiées posées :"
          crontab -l | grep "$MARQUE"
          DISTANT

          [ "$SORTIE" -eq 0 ] \
            || echo "::warning::Tâches planifiées non posées (crontab indisponible sur ce serveur ?)"

      # ── Un rattrapage de données, à la demande ────────────────────────────
      #
      # Ne tourne QUE si on l'a demandé au déclenchement. `merisu:ventes --tout`
      # ne coûte que du temps ; `merisu:meteo --historique` coûte des appels
      # FACTURÉS chez OpenWeather — environ cinq pour quatre mois. Ni l'un ni
      # l'autre ne doit partir à chaque poussée de code.
      - name: Rattraper les données
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.maintenance != 'aucune' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          PHP_BIN: ${{ vars.DEPLOY_PHP_BIN || 'php' }}
          QUOI: ${{ inputs.maintenance }}
          DEPUIS: ${{ inputs.depuis }}
        run: |
          set -euo pipefail

          # La date est REVALIDÉE ici : elle vient d'un champ libre, et elle
          # entre dans une commande distante.
          if ! printf '%s' "$DEPUIS" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Date de rattrapage illisible : attendu AAAA-MM-JJ."
            exit 1
          fi

          APP_PATH="${APP_PATH//$'\r'/}"
          APP_PATH="${APP_PATH#"${APP_PATH%%[![:space:]]*}"}"
          APP_PATH="${APP_PATH%"${APP_PATH##*[![:space:]]}"}"

          ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
              "$USER@$HOST" bash -euo pipefail -s -- \
              "$APP_PATH" "$PHP_BIN" "$QUOI" "$DEPUIS" <<'DISTANT'
          cd "$1/symfony"
          PHP="$2"; QUOI="$3"; DEPUIS="$4"

          if [ "$QUOI" = "ventes-tout" ] || [ "$QUOI" = "ventes-et-meteo" ]; then
            echo "── Historique des ventes ──"
            "$PHP" bin/console merisu:ventes --tout
          fi

          if [ "$QUOI" = "meteo-historique" ] || [ "$QUOI" = "ventes-et-meteo" ]; then
            echo "── Rattrapage météo depuis $DEPUIS ──"
            "$PHP" bin/console merisu:meteo --historique="$DEPUIS"
          fi
          DISTANT

      - name: Vérifier que le site répond
        if: ${{ vars.DEPLOY_HEALTH_URL != '' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail

          # Le test part du serveur lui-même : il valide PHP et Apache sans
          # dépendre du certificat ni de la route réseau depuis l'extérieur.
          # Un déploiement qui compile mais rend un 500 doit faire rougir ce run.
          CODE=$(ssh -i ~/.ssh/id_deploiement -p "$PORT" -o BatchMode=yes \
                     "$USER@$HOST" \
                     "curl -sS -o /dev/null -w '%{http_code}' --max-time 20 '$URL'")

          echo "$URL → HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            echo "::error::Le site répond $CODE au lieu de 200. Déploiement à vérifier."
            exit 1
          fi

      - name: Effacer la clé privée
        if: always()
        run: rm -f ~/.ssh/id_deploiement
