parameters:
    # Dossier de stockage des photos de comptage.
    merisu.upload_dir: '%kernel.project_dir%/public/uploads'
    merisu.upload_public_path: '/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Merisu\Inventory\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'

    # Empreinte des ressources statiques : elle nomme le cache du service
    # worker, et doit donc changer à chaque déploiement qui touche `assets/`.
    Merisu\Inventory\Pwa\BuildVersion:
        arguments:
            $assetsDir: '%kernel.project_dir%/public/assets'

    # ── Connexion à la base ──────────────────────────────────────────────────
    # DBAL seul (pas l'ORM) : le schéma est simple et le SQL reste lisible.
    Doctrine\DBAL\Connection:
        factory: ['Merisu\Inventory\Store\ConnectionFactory', 'create']
        arguments:
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    # ═══════════════════════════════════════════════════════════════════════
    # POINT DE BRANCHEMENT DES MODULES EXISTANTS
    #
    # Pour raccorder les vrais modules, remplacer les deux alias ci-dessous par
    # vos propres implémentations. C'est le SEUL fichier à modifier.
    #
    #   Merisu\Inventory\Adapter\ConsultantServiceInterface: '@App\Stanowisko\VotreService'
    #   Merisu\Inventory\Adapter\RecipeServiceInterface: '@App\Recipe\VotreService'
    # ═══════════════════════════════════════════════════════════════════════
    # Repli administrable : l'équipe se gère dans Admin ▸ Équipe et vit en base.
    # `LocalConsultantService` (trois fiches en dur) reste disponible pour une
    # démonstration sans base, mais n'est plus branché par défaut.
    Merisu\Inventory\Adapter\ConsultantServiceInterface:
        alias: Merisu\Inventory\Adapter\DbConsultantService

    # Codes PIN de DÉPART, écrits en base au premier `merisu:seed` et jamais
    # relus ensuite : passé l'installation, les codes se changent dans
    # Admin ▸ Équipe. Ils ne doivent PAS rester à leur valeur par défaut, celle-ci
    # étant publiée dans le dépôt.
    Merisu\Inventory\Command\SeedCommand:
        arguments:
            $adminPin: '%env(MERISU_ADMIN_PIN)%'
            $consultant1Pin: '%env(MERISU_CONSULTANT1_PIN)%'

    Merisu\Inventory\Adapter\LocalConsultantService:
        arguments:
            $adminPin: '%env(MERISU_ADMIN_PIN)%'
            $consultant1Pin: '%env(MERISU_CONSULTANT1_PIN)%'
            $consultant2Pin: '%env(MERISU_CONSULTANT2_PIN)%'

    # Clé de l'empreinte des codes PIN : hors de la base, pour qu'une base
    # dérobée seule ne livre aucun code. Voir PinHasher.
    Merisu\Inventory\Service\PinHasher:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    Merisu\Inventory\Adapter\RecipeServiceInterface:
        alias: Merisu\Inventory\Adapter\LocalRecipeService

    Merisu\Inventory\Service\PhotoStorage:
        arguments:
            $uploadDir: '%merisu.upload_dir%'
            $publicPath: '%merisu.upload_public_path%'
